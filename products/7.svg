<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3f3f8"/>
      <stop offset="100%" stop-color="#dde0f0"/>
    </radialGradient>
    <linearGradient id="box7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2050"/>
      <stop offset="50%" stop-color="#141840"/>
      <stop offset="100%" stop-color="#0E1030"/>
    </linearGradient>
    <radialGradient id="star7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0E880"/>
      <stop offset="100%" stop-color="#D0C060"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#bg7)" stroke="#ddd" stroke-width="1.5"/>
  <!-- Dark blue box - Camino midnight theme -->
  <rect x="42" y="50" width="116" height="110" rx="8" ry="8" fill="url(#box7)"/>
  <!-- Subtle border -->
  <rect x="42" y="50" width="116" height="110" rx="8" ry="8" fill="none" stroke="#2A3070" stroke-width="1"/>
  <!-- Moon/stars night scene -->
  <circle cx="120" cy="78" r="14" fill="#E8E0B0" opacity="0.8"/>
  <circle cx="126" cy="74" r="12" fill="url(#box7)"/>
  <!-- Stars -->
  <circle cx="70" cy="72" r="2" fill="#F0E880" opacity="0.7"/>
  <circle cx="85" cy="65" r="1.5" fill="#F0E880" opacity="0.6"/>
  <circle cx="95" cy="75" r="1" fill="#F0E880" opacity="0.5"/>
  <circle cx="75" cy="85" r="1.5" fill="#F0E880" opacity="0.6"/>
  <circle cx="60" cy="78" r="1" fill="#F0E880" opacity="0.5"/>
  <!-- Gummies visible - row -->
  <rect x="52" y="110" width="96" height="40" rx="5" ry="5" fill="#1E2460" opacity="0.6"/>
  <!-- Individual gummies -->
  <ellipse cx="70" cy="130" rx="10" ry="8" fill="#3040A0" opacity="0.7"/>
  <ellipse cx="95" cy="130" rx="10" ry="8" fill="#2838A0" opacity="0.7"/>
  <ellipse cx="120" cy="130" rx="10" ry="8" fill="#3040A0" opacity="0.7"/>
  <!-- Gummy shine -->
  <ellipse cx="68" cy="127" rx="4" ry="2" fill="#fff" opacity="0.15"/>
  <ellipse cx="93" cy="127" rx="4" ry="2" fill="#fff" opacity="0.12"/>
  <ellipse cx="118" cy="127" rx="4" ry="2" fill="#fff" opacity="0.15"/>
  <!-- Shadow -->
  <ellipse cx="100" cy="170" rx="52" ry="5" fill="#000" opacity="0.06"/>
</svg>