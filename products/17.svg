<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg17" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf5f8"/>
      <stop offset="100%" stop-color="#f5e0e8"/>
    </radialGradient>
    <linearGradient id="box17" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D87090"/>
      <stop offset="50%" stop-color="#C06080"/>
      <stop offset="100%" stop-color="#A85070"/>
    </linearGradient>
    <linearGradient id="patch17" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D8E0"/>
      <stop offset="100%" stop-color="#E0C0D0"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#bg17)" stroke="#ddd" stroke-width="1.5"/>
  <!-- Pink/rose box -->
  <rect x="38" y="48" width="124" height="110" rx="6" ry="6" fill="url(#box17)"/>
  <!-- Box subtle border -->
  <rect x="38" y="48" width="124" height="110" rx="6" ry="6" fill="none" stroke="#B05070" stroke-width="1"/>
  <!-- Inner panel -->
  <rect x="48" y="58" width="104" height="90" rx="4" ry="4" fill="#C86888" opacity="0.4"/>
  <!-- Patch illustration -->
  <rect x="65" y="72" width="70" height="55" rx="8" ry="8" fill="url(#patch17)"/>
  <!-- Patch grid lines (transdermal look) -->
  <line x1="75" y1="72" x2="75" y2="127" stroke="#D0B0C0" stroke-width="0.5"/>
  <line x1="85" y1="72" x2="85" y2="127" stroke="#D0B0C0" stroke-width="0.5"/>
  <line x1="95" y1="72" x2="95" y2="127" stroke="#D0B0C0" stroke-width="0.5"/>
  <line x1="105" y1="72" x2="105" y2="127" stroke="#D0B0C0" stroke-width="0.5"/>
  <line x1="115" y1="72" x2="115" y2="127" stroke="#D0B0C0" stroke-width="0.5"/>
  <line x1="125" y1="72" x2="125" y2="127" stroke="#D0B0C0" stroke-width="0.5"/>
  <line x1="65" y1="82" x2="135" y2="82" stroke="#D0B0C0" stroke-width="0.5"/>
  <line x1="65" y1="92" x2="135" y2="92" stroke="#D0B0C0" stroke-width="0.5"/>
  <line x1="65" y1="102" x2="135" y2="102" stroke="#D0B0C0" stroke-width="0.5"/>
  <line x1="65" y1="112" x2="135" y2="112" stroke="#D0B0C0" stroke-width="0.5"/>
  <!-- Cross/plus medical symbol -->
  <rect x="94" y="88" width="12" height="28" rx="2" ry="2" fill="#D87090" opacity="0.4"/>
  <rect x="86" y="96" width="28" height="12" rx="2" ry="2" fill="#D87090" opacity="0.4"/>
  <!-- Decorative dots -->
  <circle cx="52" cy="148" r="3" fill="#E0A0B8" opacity="0.5"/>
  <circle cx="62" cy="148" r="3" fill="#E0A0B8" opacity="0.5"/>
  <circle cx="72" cy="148" r="3" fill="#E0A0B8" opacity="0.5"/>
