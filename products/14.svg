<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg14" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e5e5e5"/>
    </radialGradient>
    <linearGradient id="cart14" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A2A2A"/>
      <stop offset="30%" stop-color="#3A3A3A"/>
      <stop offset="70%" stop-color="#2A2A2A"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="oil14" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8A838"/>
      <stop offset="100%" stop-color="#A08828"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#bg14)" stroke="#ddd" stroke-width="1.5"/>
  <!-- Heavy Hitters cart - thick, chunky design -->
  <rect x="84" y="42" width="32" height="100" rx="5" ry="5" fill="url(#cart14)"/>
  <!-- Wide mouthpiece -->
  <rect x="88" y="32" width="24" height="20" rx="6" ry="6" fill="#1A1A1A"/>
  <!-- Glass tank -->
  <rect x="87" y="58" width="26" height="58" rx="3" ry="3" fill="#444" opacity="0.8"/>
  <rect x="89" y="60" width="22" height="54" rx="2" ry="2" fill="url(#oil14)" opacity="0.65"/>
  <!-- Air gap at top -->
  <rect x="89" y="60" width="22" height="10" rx="2" ry="0" fill="#333" opacity="0.4"/>
  <!-- Metal base -->
  <rect x="86" y="140" width="28" height="16" rx="3" ry="3" fill="#666"/>
  <rect x="90" y="154" width="20" height="8" rx="2" ry="2" fill="#555"/>
  <!-- Thread lines -->
  <line x1="86" y1="144" x2="114" y2="144" stroke="#777" stroke-width="0.5"/>
  <line x1="86" y1="148" x2="114" y2="148" stroke="#777" stroke-width="0.5"/>
  <line x1="86" y1="152" x2="114" y2="152" stroke="#777" stroke-width="0.5"/>
  <!-- Shine -->
  <rect x="88" y="45" width="4" height="88" rx="2" ry="2" fill="#fff" opacity="0.08"/>
  <!-- Shadow -->
  <ellipse cx="100" cy="170" rx="22" ry="4" fill="#000" opacity="0.08"/>
</svg>