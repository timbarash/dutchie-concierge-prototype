<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg11" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5fafa"/>
      <stop offset="100%" stop-color="#e0f0f0"/>
    </radialGradient>
    <linearGradient id="pen11" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="20%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <linearGradient id="tip11" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20A0A8"/>
      <stop offset="100%" stop-color="#188890"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#bg11)" stroke="#ddd" stroke-width="1.5"/>
  <!-- Dosist pen - minimal cylindrical design -->
  <rect x="91" y="30" width="18" height="140" rx="9" ry="9" fill="url(#pen11)" stroke="#ddd" stroke-width="0.5"/>
  <!-- Teal indicator band -->
  <rect x="91" y="125" width="18" height="20" rx="0" ry="0" fill="url(#tip11)"/>
  <!-- Bottom cap -->
  <rect x="91" y="160" width="18" height="10" rx="4" ry="4" fill="#ccc"/>
  <!-- Top mouthpiece -->
  <rect x="95" y="25" width="10" height="12" rx="5" ry="5" fill="#e8e8e8"/>
  <!-- Dose indicator dots -->
  <circle cx="100" cy="60" r="1.5" fill="#20A0A8" opacity="0.6"/>
  <circle cx="100" cy="70" r="1.5" fill="#20A0A8" opacity="0.6"/>
  <circle cx="100" cy="80" r="1.5" fill="#20A0A8" opacity="0.6"/>
  <circle cx="100" cy="90" r="1.5" fill="#ccc" opacity="0.5"/>
  <circle cx="100" cy="100" r="1.5" fill="#ccc" opacity="0.5"/>
  <!-- Subtle shine -->
  <rect x="93" y="35" width="3" height="120" rx="1.5" ry="1.5" fill="#fff" opacity="0.3"/>
  <!-- Shadow -->
  <ellipse cx="100" cy="178" rx="14" ry="3" fill="#000" opacity="0.08"/>
</svg>