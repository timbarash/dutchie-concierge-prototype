<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Soft background circle -->
  <circle cx="60" cy="60" r="52" fill="#FFF3E0"/>
  <!-- Gummy bear 1 (orange) - center -->
  <g transform="translate(46, 32)">
    <!-- Head -->
    <circle cx="14" cy="8" r="8" fill="#FF8A65"/>
    <!-- Ears -->
    <circle cx="7" cy="3" r="3.5" fill="#FF8A65"/>
    <circle cx="21" cy="3" r="3.5" fill="#FF8A65"/>
    <!-- Body -->
    <ellipse cx="14" cy="24" rx="10" ry="12" fill="#FF8A65"/>
    <!-- Arms -->
    <ellipse cx="3" cy="20" rx="4" ry="6" fill="#FF8A65" transform="rotate(-15, 3, 20)"/>
    <ellipse cx="25" cy="20" rx="4" ry="6" fill="#FF8A65" transform="rotate(15, 25, 20)"/>
    <!-- Legs -->
    <ellipse cx="8" cy="38" rx="4.5" ry="6" fill="#FF8A65"/>
    <ellipse cx="20" cy="38" rx="4.5" ry="6" fill="#FF8A65"/>
    <!-- Shine -->
    <ellipse cx="10" cy="20" rx="3" ry="5" fill="white" opacity="0.2"/>
  </g>
  <!-- Gummy bear 2 (yellow, smaller, left) -->
  <g transform="translate(14, 58) scale(0.65)">
    <circle cx="14" cy="8" r="8" fill="#FFB74D"/>
    <circle cx="7" cy="3" r="3.5" fill="#FFB74D"/>
    <circle cx="21" cy="3" r="3.5" fill="#FFB74D"/>
    <ellipse cx="14" cy="24" rx="10" ry="12" fill="#FFB74D"/>
    <ellipse cx="3" cy="20" rx="4" ry="6" fill="#FFB74D" transform="rotate(-15, 3, 20)"/>
    <ellipse cx="25" cy="20" rx="4" ry="6" fill="#FFB74D" transform="rotate(15, 25, 20)"/>
    <ellipse cx="8" cy="38" rx="4.5" ry="6" fill="#FFB74D"/>
    <ellipse cx="20" cy="38" rx="4.5" ry="6" fill="#FFB74D"/>
    <ellipse cx="10" cy="20" rx="3" ry="5" fill="white" opacity="0.2"/>
  </g>
  <!-- Gummy bear 3 (purple, smaller, right) -->
  <g transform="translate(72, 55) scale(0.7)">
    <circle cx="14" cy="8" r="8" fill="#CE93D8"/>
    <circle cx="7" cy="3" r="3.5" fill="#CE93D8"/>
    <circle cx="21" cy="3" r="3.5" fill="#CE93D8"/>
    <ellipse cx="14" cy="24" rx="10" ry="12" fill="#CE93D8"/>
    <ellipse cx="3" cy="20" rx="4" ry="6" fill="#CE93D8" transform="rotate(-15, 3, 20)"/>
    <ellipse cx="25" cy="20" rx="4" ry="6" fill="#CE93D8" transform="rotate(15, 25, 20)"/>
    <ellipse cx="8" cy="38" rx="4.5" ry="6" fill="#CE93D8"/>
    <ellipse cx="20" cy="38" rx="4.5" ry="6" fill="#CE93D8"/>
    <ellipse cx="10" cy="20" rx="3" ry="5" fill="white" opacity="0.2"/>
  </g>
</svg>