<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Soft background circle -->
  <circle cx="60" cy="60" r="52" fill="#FFF8E1"/>
  <!-- Container base (round silicone jar) -->
  <ellipse cx="60" cy="72" rx="30" ry="8" fill="#FFA000"/>
  <rect x="30" y="52" width="60" height="20" rx="0" fill="#FFB300"/>
  <ellipse cx="60" cy="52" rx="30" ry="8" fill="#FFB300"/>
  <!-- Lid (slightly open / shifted) -->
  <g transform="translate(8, -14) rotate(8, 60, 42)">
    <ellipse cx="60" cy="46" rx="28" ry="7" fill="#FFA000"/>
    <rect x="32" y="38" width="56" height="8" rx="0" fill="#FFB300"/>
    <ellipse cx="60" cy="38" rx="28" ry="7" fill="#FFB300"/>
    <!-- Lid top highlight -->
    <ellipse cx="56" cy="37" rx="10" ry="3" fill="white" opacity="0.15"/>
  </g>
  <!-- Golden concentrate inside -->
  <ellipse cx="60" cy="52" rx="22" ry="5" fill="#FFA000" opacity="0.7"/>
  <!-- Shiny wax globs -->
  <circle cx="54" cy="51" r="4" fill="#FFB300" opacity="0.6"/>
  <circle cx="64" cy="50" r="3" fill="#FFB300" opacity="0.5"/>
  <circle cx="58" cy="53" r="2.5" fill="white" opacity="0.12"/>
  <!-- Honeycomb accent (small, decorative) -->
  <g transform="translate(70, 18)" opacity="0.4">
    <polygon points="8,0 14,4 14,12 8,16 2,12 2,4" fill="none" stroke="#FFA000" stroke-width="1.2"/>
    <polygon points="20,0 26,4 26,12 20,16 14,12 14,4" fill="none" stroke="#FFA000" stroke-width="1.2"/>
    <polygon points="14,16 20,20 20,28 14,32 8,28 8,20" fill="none" stroke="#FFA000" stroke-width="1.2"/>
  </g>
</svg>