<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf8f5"/>
      <stop offset="100%" stop-color="#f5e8e0"/>
    </radialGradient>
    <linearGradient id="tube8" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E06030"/>
      <stop offset="30%" stop-color="#F07038"/>
      <stop offset="70%" stop-color="#E06030"/>
      <stop offset="100%" stop-color="#C85028"/>
    </linearGradient>
    <linearGradient id="cap8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C84020"/>
      <stop offset="100%" stop-color="#A03018"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#bg8)" stroke="#ddd" stroke-width="1.5"/>
  <!-- Jeeter tube - tilted slightly -->
  <g transform="rotate(-15, 100, 100)">
    <!-- Main tube body -->
    <rect x="85" y="30" width="30" height="130" rx="15" ry="15" fill="url(#tube8)"/>
    <!-- Cap top -->
    <rect x="85" y="28" width="30" height="25" rx="15" ry="15" fill="url(#cap8)"/>
    <!-- Cap line -->
    <line x1="85" y1="50" x2="115" y2="50" stroke="#A03018" stroke-width="1.5"/>
    <!-- Tube shine -->
    <rect x="88" y="55" width="6" height="95" rx="3" ry="3" fill="#fff" opacity="0.15"/>
    <!-- Label band -->
    <rect x="85" y="80" width="30" height="45" rx="0" ry="0" fill="#D05028" opacity="0.5"/>
    <rect x="85" y="80" width="30" height="1" fill="#fff" opacity="0.15"/>
    <rect x="85" y="125" width="30" height="1" fill="#fff" opacity="0.15"/>
    <!-- Bottom of tube -->
    <ellipse cx="100" cy="158" rx="15" ry="4" fill="#C85028" opacity="0.8"/>
  </g>
  <!-- Shadow -->
  <ellipse cx="100" cy="175" rx="30" ry="4" fill="#000" opacity="0.07"/>
</svg>