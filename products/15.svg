<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg15" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f3f0"/>
      <stop offset="100%" stop-color="#e8e0d8"/>
    </radialGradient>
    <linearGradient id="choc15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2018"/>
      <stop offset="50%" stop-color="#2C1810"/>
      <stop offset="100%" stop-color="#201008"/>
    </linearGradient>
    <linearGradient id="wrap15" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A3020"/>
      <stop offset="50%" stop-color="#3A2418"/>
      <stop offset="100%" stop-color="#4A3020"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#bg15)" stroke="#ddd" stroke-width="1.5"/>
  <!-- Chocolate bar wrapper -->
  <rect x="35" y="55" width="130" height="95" rx="4" ry="4" fill="url(#wrap15)"/>
  <!-- Foil peeking out -->
  <rect x="35" y="55" width="45" height="95" rx="4" ry="0" fill="#C0B8A0" opacity="0.4"/>
  <!-- Exposed chocolate -->
  <rect x="40" y="60" width="38" height="85" rx="2" ry="2" fill="url(#choc15)"/>
  <!-- Chocolate squares -->
  <rect x="42" y="62" width="16" height="18" rx="2" ry="2" fill="#3A2018" stroke="#2C1810" stroke-width="0.5"/>
  <rect x="60" y="62" width="16" height="18" rx="2" ry="2" fill="#3A2018" stroke="#2C1810" stroke-width="0.5"/>
  <rect x="42" y="82" width="16" height="18" rx="2" ry="2" fill="#3A2018" stroke="#2C1810" stroke-width="0.5"/>
  <rect x="60" y="82" width="16" height="18" rx="2" ry="2" fill="#3A2018" stroke="#2C1810" stroke-width="0.5"/>
  <rect x="42" y="102" width="16" height="18" rx="2" ry="2" fill="#3A2018" stroke="#2C1810" stroke-width="0.5"/>
  <rect x="60" y="102" width="16" height="18" rx="2" ry="2" fill="#3A2018" stroke="#2C1810" stroke-width="0.5"/>
  <rect x="42" y="122" width="16" height="18" rx="2" ry="2" fill="#3A2018" stroke="#2C1810" stroke-width="0.5"/>
  <rect x="60" y="122" width="16" height="18" rx="2" ry="2" fill="#3A2018" stroke="#2C1810" stroke-width="0.5"/>
  <!-- Chocolate shine -->
  <rect x="44" y="64" width="4" height="6" rx="1" ry="1" fill="#fff" opacity="0.08"/>
  <rect x="62" y="84" width="4" height="6" rx="1" ry="1" fill="#fff" opacity="0.06"/>
  <!-- Wrapper design elements -->
  <rect x="82" y="80" width="78" height="2" fill="#5A4030" opacity="0.5"/>
  <rect x="82" y="125" width="78" height="2" fill="#5A4030" opacity="0.5"/>
  <!-- Shadow -->
  <ellipse cx="100" cy="162" rx="58" ry="5" fill="#000" opacity="0.06"/>
</svg>